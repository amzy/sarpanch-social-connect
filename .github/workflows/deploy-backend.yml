name: Deploy Firebase rules and Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "worker/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deployment
  cancel-in-progress: false

jobs:
  deploy-firebase-rules:
    name: Deploy Firebase security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules only (Spark)
        run: firebase deploy --only firestore:rules --project sarpanch-social-connect --non-interactive

  deploy-cloudflare-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Check Worker types
        run: npm run check

      - name: Provision free-tier media namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          # Wrangler v4 emits JSON directly; --json is not a supported flag.
          npx wrangler kv namespace list > /tmp/kv-namespaces.json
          NAMESPACE_ID="$(node -e 'const a=require("/tmp/kv-namespaces.json"); const x=a.find(v=>v.title==="sarpanch-social-connect-media"); if(x) process.stdout.write(x.id);')"
          if [ -z "$NAMESPACE_ID" ]; then
            npx wrangler kv namespace create sarpanch-social-connect-media
            # Re-list after creation instead of parsing the human-readable create output.
            npx wrangler kv namespace list > /tmp/kv-namespaces.json
            NAMESPACE_ID="$(node -e 'const a=require("/tmp/kv-namespaces.json"); const x=a.find(v=>v.title==="sarpanch-social-connect-media"); if(x) process.stdout.write(x.id);')"
          fi
          if [ -z "$NAMESPACE_ID" ]; then
            echo "Unable to provision the Workers KV media namespace."
            exit 1
          fi
          NAMESPACE_ID="$NAMESPACE_ID" node -e 'const fs=require("fs"); const p="wrangler.toml"; const s=fs.readFileSync(p,"utf8"); if(!s.includes("__KV_NAMESPACE_ID__")) throw new Error("KV namespace placeholder missing"); fs.writeFileSync(p,s.replace("__KV_NAMESPACE_ID__",process.env.NAMESPACE_ID));'
          echo "Workers KV media namespace is ready."

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
